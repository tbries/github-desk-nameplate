<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Nameplate Designer</title>
    <meta
      name="description"
      content="Plan the dot layout for your GitHub contribution-graph desk nameplate."
    />
    <!-- Full-page app feel when added to a phone home screen (standalone). -->
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Nameplate" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <button
        type="button"
        id="plate-theme"
        class="plate-theme"
        aria-label="Swap plate &amp; logo colors: Switch to white plate with black logo"
        title="Switch to white plate with black logo"
      >
        <span class="plate-theme-icon" aria-hidden="true"></span>
        <span>Swap plate &amp; logo colors</span>
      </button>
      <div class="color-field header-color-field header-reset-field">
        <span>Reset</span>
        <button
          type="button"
          id="clear-all"
          class="header-reset"
          aria-label="Clear all dots"
          title="Clear all dots"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4v6h6" />
            <path d="M5.5 15a7 7 0 1 0 .7-7.8L4 10" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="stage-wrap">
        <div class="stage" id="stage" tabindex="0" aria-label="Nameplate grid">
          <div id="nameplate-host"></div>
        </div>
      </section>

      <section class="toolbar" aria-label="Design settings">
        <div
          class="toolbar-group toolbar-colors"
          aria-label="Dot colors and shift controls"
        >
          <button
            type="button"
            id="shift-left"
            class="btn btn-ghost btn-arrange"
            aria-label="Shift all dots left one column"
            title="Shift all dots left"
          >
            ◀
          </button>
          <div class="palette" id="palette" aria-label="Dot colors"></div>
          <input
            type="color"
            id="custom-color"
            class="visually-hidden-color"
            value="#00c2a8"
            aria-label="Add custom dot color"
          />
          <button
            type="button"
            id="shift-right"
            class="btn btn-ghost btn-arrange"
            aria-label="Shift all dots right one column"
            title="Shift all dots right"
          >
            ▶
          </button>
        </div>

        <div class="toolbar-group toolbar-text">
          <label class="text-tool" for="text-input">
            <input
              type="text"
              id="text-input"
              class="text-tool-input"
              placeholder="Add text... 'mona'"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="Insert text to draw on the nameplate"
            />
          </label>
          <div class="text-size" role="group" aria-label="Letter size">
            <button type="button" class="size-btn" data-size="narrow">
              Narrow
            </button>
            <button
              type="button"
              class="size-btn"
              data-size="regular"
              aria-pressed="true"
            >
              Regular
            </button>
            <button type="button" class="size-btn" data-size="wide">
              Wide
            </button>
          </div>
          <div class="text-align" role="group" aria-label="Text justification">
            <button
              type="button"
              class="align-btn"
              data-align="left"
              aria-pressed="true"
              aria-label="Align text left"
              title="Align left"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16M4 10h11M4 14h16M4 18h8" />
              </svg>
            </button>
            <button
              type="button"
              class="align-btn"
              data-align="center"
              aria-label="Center text"
              title="Center"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16M6.5 10h11M4 14h16M8 18h8" />
              </svg>
            </button>
            <button
              type="button"
              class="align-btn"
              data-align="right"
              aria-label="Align text right"
              title="Align right"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16M9 10h11M4 14h16M12 18h8" />
              </svg>
            </button>
          </div>
        </div>

        <div
          class="toolbar-group shape-tools"
          role="group"
          aria-label="History and shapes"
        >
          <button
            type="button"
            id="undo"
            class="history-btn"
            aria-label="Undo"
            aria-keyshortcuts="Control+Z Meta+Z"
            title="Undo (Ctrl/Command+Z)"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 7 4 12l5 5" />
              <path d="M4 12h9a7 7 0 0 1 7 7" />
            </svg>
          </button>
          <button
            type="button"
            id="redo"
            class="history-btn"
            aria-label="Redo"
            aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y"
            title="Redo (Ctrl/Command+Shift+Z)"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 7 5 5-5 5" />
              <path d="M20 12h-9a7 7 0 0 0-7 7" />
            </svg>
          </button>
          <button
            type="button"
            class="shape-btn"
            data-shape="heart"
            aria-label="Add heart shape"
            title="Add heart"
          >
            ❤️
          </button>
          <button
            type="button"
            class="shape-btn"
            data-shape="snowflake"
            aria-label="Add snowflake shape"
            title="Add snowflake"
          >
            ❆
          </button>
        </div>

        <div class="toolbar-group zoom-control" aria-label="Nameplate size">
          <button
            type="button"
            id="zoom-out"
            class="zoom-btn"
            aria-label="Smaller dots"
          >
            −
          </button>
          <span class="zoom-label" id="zoom-label">100%</span>
          <button
            type="button"
            id="zoom-in"
            class="zoom-btn"
            aria-label="Larger dots"
          >
            +
          </button>
        </div>
      </section>

    </main>

    <script src="font.js"></script>
    <script src="app.js"></script>
  </body>
</html>
