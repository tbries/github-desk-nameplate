name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "github-pages/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: github-pages

      - name: Wait for artifact discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq "[.artifacts[] | select(.name == \"$PAGES_ARTIFACT_NAME\" and .expired == false)] | length")
            if [ "$count" -eq 1 ]; then
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple Pages artifacts found for this attempt."
              exit 1
            fi
            echo "Waiting for Pages artifact visibility ($attempt/12)..."
            sleep 5
          done
          echo "::error::Pages artifact was not discoverable within 60 seconds."
          exit 1

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
